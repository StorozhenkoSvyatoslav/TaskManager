<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager — Desktop</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 80px auto; padding: 0 20px; text-align: center; }
  h1 { color: #1976d2; }
  .btn { display: inline-block; margin: 24px 0; padding: 16px 40px; background: #1976d2;
         color: #fff; text-decoration: none; border-radius: 8px; font-size: 18px; }
  .btn:hover { background: #1565c0; }
  code { background: #f0f4f8; padding: 4px 10px; border-radius: 4px; font-size: 14px; }
  .note { color: #666; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Task Manager</h1>
  <p>Desktop application for Linux (requires Java 21+)</p>
  <a class="btn" href="/taskmanager.jar">Download JAR</a>
  <p class="note">Run with: <code>java -jar taskmanager.jar</code></p>
  <p class="note">Server URL is pre-configured in this build.</p>
</body>
</html>
